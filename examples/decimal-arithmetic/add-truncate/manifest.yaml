  source_format: fixed
  compiler_flags:
  - -Wall
target:
  language: python
  entrypoint: main.py
execution:
  inputs:
  - fixture: amounts.dat
    sandbox_path: amounts.dat
  outputs:
  - results.dat
  network_profile: disabled
input_domain:
  description: 'add-truncate: numeric DISPLAY records; stored digits represent integer
    units scaled by each PIC V, with a separate leading sign when declared.'
  encoding: ascii
  reviewed: true
  record_width_bytes: 10
  constraints:
  - 0..3 LF-terminated fixed-width records. Arithmetic uses COBOL receiving-field
    precision.
  - Field integer ranges are scaled units, not decimal strings with a point.
  generator:
    kind: fixed_records
    input: amounts.dat
    record_count:
      min: 0
      max: 3
    line_ending: lf
    fields:
    - name: amount
      type: integer
      offset: 0
      width: 5
      min: 0
      max: 99999
      sign: none
    - name: adjustment
      type: integer
      offset: 5
      width: 5
      min: 0
      max: 99999
      sign: none
